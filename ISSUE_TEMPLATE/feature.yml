name: Feature request
description: Propose a customer problem to solve
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: What would success look like?
    validations:
      required: true
